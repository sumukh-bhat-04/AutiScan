{% extends 'base.html' %}

{% block title %}Email Sent | AutiScan{% endblock %}

{% block content %}
<div class="fade-in"
    style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="glass-panel" style="width: 100%; max-width: 450px; padding: 3rem; text-align: center;">

        <div
            style="width: 60px; height: 60px; background: rgba(74, 222, 128, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="var(--success-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </div>

        <h2 style="margin-bottom: 1rem; color: var(--text-primary);">Check Your Email</h2>
        <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
            We've sent you instructions to set your password. If an account exists with the email you entered, you
            should receive them shortly.
        </p>

        <a href="/auth/login/" class="btn btn-primary" style="width: 100%;">Back to Login</a>

    </div>
</div>
{% endblock %}
