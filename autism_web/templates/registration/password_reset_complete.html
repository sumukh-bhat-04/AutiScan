{% extends 'base.html' %}

{% block title %}Password Reset Complete | AutiScan{% endblock %}

{% block content %}
<div class="fade-in"
    style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="glass-panel" style="width: 100%; max-width: 450px; padding: 3rem; text-align: center;">

        <div
            style="width: 60px; height: 60px; background: rgba(74, 222, 128, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="var(--success-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>

        <h2 style="margin-bottom: 1rem; color: var(--text-primary);">Password Reset!</h2>
        <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
            Your password has been set. You can now log in with your new password.
        </p>

        <a href="/auth/login/" class="btn btn-primary" style="width: 100%;">Log In Now</a>

    </div>
</div>
{% endblock %}
